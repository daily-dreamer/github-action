name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment/build environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
      run-tests:
        description: 'Run test suite during manual trigger'
        required: true
        default: true
        type: boolean

jobs:
  test:
    name: Run Tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Cache npm dependency store (~/.npm)
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build Project
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Cache npm dependency store
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # 2. Cache Framework Build Output (e.g., Next.js / React / Vite / Nuxt)
      - name: Cache build output
        uses: actions/cache@v4
        with:
          # Change this path according to your build tool output directory:
          # Next.js: .next/cache
          # Vite / React / Vue: dist or .vite
          # Nuxt: .nuxt
          path: |
            .next/cache
            dist
            build
          # Key incorporates OS, node version, commit hash, and source file changes
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build project
        run: npm run build
        env:
          BUILD_ENV: ${{ inputs.environment || 'production' }}
